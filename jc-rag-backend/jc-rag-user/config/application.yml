server:
  port: 8082
  servlet:
    session:
      timeout: 60m
      cookie:
        max-age: 60m
        name: USER_SESSION

spring:
  application:
    name: jc-rag-user
  profiles:
    active: dev
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    serialization:
      write-dates-as-timestamps: false
  messages:
    basename: i18n/messages
    encoding: UTF-8
    use-code-as-default-message: false
  # Flyway 数据库迁移
  # user 端不直接放 SQL, 通过 jc-rag-admin 依赖自动加载 community/ 目录
  # baseline-version=27: 存量库 baseline 在 V27, 与 community admin 保持一致
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 27
    locations: classpath:db/migration/community
    table: flyway_schema_history
    validate-on-migrate: true
    clean-disabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

app:
  name: JC RAG User Portal
  version: 0.0.1-SNAPSHOT
