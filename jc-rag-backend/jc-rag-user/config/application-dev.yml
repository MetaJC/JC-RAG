spring:
  datasource:
    url: jdbc:mysql://localhost:3308/jc_rag?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: root123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 3000ms

service:
  python:
    rag:
      base-url: http://localhost:8001

# L3 跨会话画像触发配置 (与 Python 端 rag_config.yml: memory.profile 配合)
jc-rag:
  memory:
    profile:
      trigger-rounds: 10    # 每累计 N 轮对话触发一次画像提取 (从 L2 fact 聚合)
    # L0 聊天历史保留策略: 物理删除 N 天前的 chat_message / chat_session / chat_session_summary
    # <p>默认值 90 天; 设 0 或负数即关闭 retention (不删).
    # <p>cron 默认每天 03:00 执行 (与 L1 摘要压缩避开).
    l0:
      retention-days: 90
      retention-cron: "0 0 3 * * ?"

