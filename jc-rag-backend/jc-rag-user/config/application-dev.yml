# =============================================================================
# jc-rag-user 开发环境配置 (profile: dev)
# -----------------------------------------------------------------------------
# 仅存放开发环境专属值: 本地数据源 / 本地服务地址.
# 环境无关配置见 application.yml.
# =============================================================================
spring:
  datasource:
    url: jdbc:mysql://localhost:3308/jc_rag?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: root123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 3000ms

service:
  python:
    rag:
      # [兜底默认值] user 端直接读取本配置 (无 sys_config 覆盖入口);
      # 修改 Python RAG 服务地址需同步修改此处与 admin 端配置.
      base-url: http://localhost:8001

# L3 跨会话画像触发配置 (与 Python 端 rag_config.yml: memory.profile 配合)
jc-rag:
  memory:
    profile:
      trigger-rounds: 10    # 每累计 N 轮对话触发一次画像提取 (从 L2 fact 聚合)
    # L0 聊天历史保留策略: 物理删除 N 天前的 chat_message / chat_session / chat_session_summary
    # <p>默认值 90 天; 设 0 或负数即关闭 retention (不删).
    # <p>cron 默认每天 03:00 执行 (与 L1 摘要压缩避开).
    l0:
      retention-days: 90
      retention-cron: "0 0 3 * * ?"
  # 短信服务商凭证 (开发环境填写入口; 两家可同时配, provider 在 application.yml 切换)
  # 启用真实渠道步骤: 1) 取消对应注释并填入凭证 2) application.yml 的 jc-rag.sms.provider 改为 aliyun/tencent
  # sms:
  #   aliyun:
  #     key-id: 您的 AccessKey ID
  #     key-secret: 您的 AccessKey Secret
  #     sign: 您的短信签名
  #     template-code: SMS_xxx
  #   tencent:
  #     key-id: 您的 SecretId
  #     key-secret: 您的 SecretKey
  #     app-id: '1400xxxxxx'
  #     sign: 您的短信签名
  #     template-code: 您的模板 ID

