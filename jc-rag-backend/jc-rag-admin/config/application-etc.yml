spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/jc_rag?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${DB_USER:jc_rag}
    password: ${DB_PASSWORD:please_change_me}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 3000ms

knowledge:
  upload:
    max-file-size: 200MB
    max-request-size: 1000MB
    parse-timeout: 60m
    allowed-extensions:
      - pdf
      - doc
      - docx
      - txt
      - md
      - json
      - csv
      - log
      - xml
      - html

service:
  python:
    rag:
      base-url: ${PYTHON_RAG_URL:http://127.0.0.1:8001}

storage:
  minio:
    endpoint: ${MINIO_ENDPOINT:http://127.0.0.1:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket:
      documents: ${MINIO_BUCKET:jc-rag-docs}

elasticsearch:
  url: ${ES_URL:http://127.0.0.1:9200}
