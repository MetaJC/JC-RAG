# =============================================================================
# jc-rag-admin 主配置 (环境无关项)
# -----------------------------------------------------------------------------
# 分层约定:
#   application.yml      —— 不随环境变动的配置 (应用标识/框架机制/RBAC 默认值)
#   application-dev.yml  —— 开发环境配置 (本地数据源/服务地址)
#   application-etc.yml  —— 生产部署配置 (环境变量占位符)
#   application-oss.yml  —— 开源版版本标识开关 (edition/feature)
# 切换环境: --spring.profiles.active=etc 或环境变量 SPRING_PROFILES_ACTIVE
# =============================================================================
server:
  port: 8080
  servlet:
    session:
      timeout: 60m
      cookie:
        max-age: 60m
        name: ADMIN_SESSION

spring:
  application:
    name: jc-rag-admin
  profiles:
    active: dev
  servlet:
    multipart:
      max-file-size: ${knowledge.upload.max-file-size}
      max-request-size: ${knowledge.upload.max-request-size}
  messages:
    basename: i18n/messages
    encoding: UTF-8
    fallback-to-system-locale: false
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    serialization:
      write-dates-as-timestamps: false
  # Flyway 数据库迁移 (社区版主源)
  # 脚本目录: jc-rag-admin/src/main/resources/db/migration/community/V*__*.sql
  # 商业版通过 Maven 多模块 classpath 合并自动加载同一目录
  # baseline-version=27: 存量库 (已手工跑过 V1~V26) 首次启动时, Flyway 会在 V27 处打 baseline,
  #   不重跑 V1~V26, 避免 INSERT 重复. 后续新增 V28+ 两库都会自动执行.
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 27
    locations: classpath:db/migration/community
    table: flyway_schema_history
    validate-on-migrate: true
    # out-of-order=true: 允许补跑中间缺失的 migration (避免新增 SQL 被 strict validate 拒绝)
    out-of-order: true
    clean-disabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  global-config:
    db-config:
      id-type: auto

app:
  name: JC RAG Admin Backend
  version: 0.0.1-SNAPSHOT
  deployment-mode: offline-ready
  rbac:
    default-password: 123456
    developer-username: developer
    reserved-user-types:
      - DEVELOPER
    sensitive-fields:
      - password
      - newPassword
      - oldPassword
      - oldPwd
      - pwd
