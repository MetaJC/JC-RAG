spring:
  datasource:
    url: jdbc:mysql://localhost:3308/jc_rag?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: root123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 3000ms
  messages:
    basename: i18n/messages
    encoding: UTF-8
    fallback-to-system-locale: false

knowledge:
  upload:
    max-file-size: 200MB
    max-request-size: 1000MB
    parse-timeout: 60m
    allowed-extensions:
      - pdf
      - doc
      - docx
      - txt
      - md
      - json
      - csv
      - log
      - xml
      - html

service:
  python:
    rag:
      base-url: http://localhost:8001
  ollama:
    base-url: http://localhost:11434
    chat-path: /api/chat
    tags-path: /api/tags
  lmstudio:
    base-url: http://localhost:1234
  elasticsearch:
    base-url: http://localhost:9200
  minio:
    endpoint: http://localhost:9000
  frontend:
    base-url: http://localhost:5173
  admin-backend:
    base-url: http://localhost:8080

storage:
  minio:
    endpoint: http://localhost:9000
    access-key: minioadmin
    secret-key: minioadmin
    bucket:
      documents: jc-rag-docs

elasticsearch:
  url: http://localhost:9200


# ============ RBAC 默认配置 (可被环境覆盖) ============
app:
  rbac:
    default-password: 123456
    developer-username: developer
    reserved-user-types:
      - DEVELOPER
    sensitive-fields:
      - password
      - newPassword
      - oldPassword
      - oldPwd
      - pwd
