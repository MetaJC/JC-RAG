# =============================================================================
# jc-rag-admin 开发环境配置 (profile: dev)
# -----------------------------------------------------------------------------
# 仅存放开发环境专属值: 本地数据源 / 本地服务地址.
# 环境无关配置见 application.yml, 生产部署见 application-etc.yml.
# 以下地址/凭证均支持环境变量覆盖, 格式 ${ENV:默认值}: 有环境变量用环境变量, 无则用默认值.
#   示例: DB_HOST / DB_PORT / DB_USERNAME / DB_PASSWORD
#         REDIS_HOST / REDIS_PORT / PYTHON_RAG_URL
#         MINIO_ENDPOINT / MINIO_ACCESS_KEY / MINIO_SECRET_KEY / ELASTICSEARCH_URL
# =============================================================================
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/jc_rag?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 3000ms

knowledge:
  upload:
    max-file-size: 200MB
    max-request-size: 1000MB
    parse-timeout: 60m
    allowed-extensions:
      - pdf
      - doc
      - docx
      - txt
      - md
      - json
      - csv
      - log
      - xml
      - html

service:
  python:
    rag:
      # [兜底默认值] 运行时优先读取 sys_config 的 service.python.rag.baseUrl;
      # 系统读取不到有效值时, 才以本配置文件的值作为默认值.
      base-url: ${PYTHON_RAG_URL:http://localhost:8001}
  # 已清理无代码引用的死配置: service.lmstudio / service.minio / service.elasticsearch
  # (MinIO 实际走 storage.minio.*, ES 实际走 elasticsearch.url, Ollama 运行时由后台页面配置)

storage:
  minio:
    # [本地默认值] 当前 MinIO 配置仅由配置文件生效, 暂无后台覆盖入口.
    # 可用环境变量覆盖: MINIO_ENDPOINT / MINIO_ACCESS_KEY / MINIO_SECRET_KEY
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket:
      documents: jc-rag-docs

elasticsearch:
  # [本地默认值] 当前仅由配置文件生效, 暂无后台覆盖入口 (健康检查探测用).
  url: ${ELASTICSEARCH_URL:http://localhost:9200}
