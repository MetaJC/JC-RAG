# =============================================================================
# jc-rag-admin 开发环境配置 (profile: dev)
# -----------------------------------------------------------------------------
# 仅存放开发环境专属值: 本地数据源 / 本地服务地址.
# 环境无关配置见 application.yml, 生产部署见 application-etc.yml.
# =============================================================================
spring:
  datasource:
    url: jdbc:mysql://localhost:3308/jc_rag?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: root123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 3000ms

knowledge:
  upload:
    max-file-size: 200MB
    max-request-size: 1000MB
    parse-timeout: 60m
    allowed-extensions:
      - pdf
      - doc
      - docx
      - txt
      - md
      - json
      - csv
      - log
      - xml
      - html

service:
  python:
    rag:
      # [兜底默认值] 运行时优先读取 sys_config 的 service.python.rag.baseUrl;
      # 系统读取不到有效值时, 才以本配置文件的值作为默认值.
      base-url: http://localhost:8001
  # 已清理无代码引用的死配置: service.lmstudio / service.minio / service.elasticsearch
  # (MinIO 实际走 storage.minio.*, ES 实际走 elasticsearch.url, Ollama 运行时由后台页面配置)

storage:
  minio:
    # [本地默认值] 当前 MinIO 配置仅由配置文件生效, 暂无后台覆盖入口.
    endpoint: http://localhost:9000
    access-key: minioadmin
    secret-key: minioadmin
    bucket:
      documents: jc-rag-docs

elasticsearch:
  # [本地默认值] 当前仅由配置文件生效, 暂无后台覆盖入口 (健康检查探测用).
  url: http://localhost:9200
