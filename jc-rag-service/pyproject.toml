[project]
name = "jc-rag-python"
version = "0.0.1-SNAPSHOT"
description = "JC RAG 开源版 Python 后端 (知识库解析 / 检索 / 嵌入 / LLM 路由)"
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.32.1",
    "pydantic==2.10.3",
    "pydantic-settings==2.6.1",
    "httpx==0.28.1",
    "PyYAML==6.0.2",
    "langchain==0.3.9",
    "langchain-community==0.3.9",
    "sentence-transformers==3.3.1",
    "elasticsearch==8.17.0",
    "pypdf==5.5.0",
    "PyMuPDF==1.24.14",
    "python-docx==1.1.2",
    "opencv-python==4.11.0.86",
    "rapidocr-onnxruntime==1.4.4",
    "onnxruntime-directml==1.22.0",
    "minio==7.2.15",
    "psutil==5.9.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "httpx>=0.28",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = [".venv", "data", "__pycache__"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # line too long (由 line-length 控制)
    "B008",  # function call in default argument (FastAPI Depends)
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
warn_unused_configs = true
exclude = ["data", ".venv", "__pycache__"]

[tool.pytest.ini_options]
testpaths = ["tests", "app"]
asyncio_mode = "auto"
