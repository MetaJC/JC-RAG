[project]
name = "jc-rag-community"
version = "0.0.1.dev0"
description = "JC RAG 社区版 Python Service. RAG 业务实现 (FastAPI). 可作为 wheel 被商业版 in-process 集成, 也可独立运行 (uvicorn app.main:app)."
requires-python = ">=3.10"

# ============================================================
# 安装矩阵: 依赖分为基础依赖 (API 服务 + 文档解析 OCR) 与 local-model extra (本地模型推理)
# ============================================================
# A. 纯在线模型部署 (embedding.source: service, 不需要本地算力, 不装 torch)
#      pip install -e .
#
# B. 本地模型部署 (先装 local-model extra, 再按环境选 torch)
#      pip install -e .[local-model]
#    本项目不固定 torch 版本, 装完 extra 后按你的环境选一种:
#    1. 纯 CPU (任何机器都能跑, 性能最差)
#         无需额外操作, extra 隐式装 CPU 版 torch
#    2. NVIDIA GPU 加速 (按 CUDA 版本选, 推荐 cu126 或 cu128)
#         pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cu118
#         pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cu121
#         pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cu124
#         pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cu126
#         pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cu128
#       (CUDA 13.x: 暂无官方 wheel, 先用 cu128 兼容 13.x, 或等官方发布)
#    3. Intel/AMD 集显/独显 加速 (仅 Windows + DirectML, 兼容 Intel Arc/UHD, AMD Radeon)
#         pip install torch-directml
#         (onnxruntime-directml 已由 local-model extra 在 Windows 上自动安装)
#    4. Apple Silicon (M1/M2/M3/M4) - PyTorch 自动走 MPS, 无需额外操作
#    5. AMD ROCm 加速 (Linux, AMD 独显)
#         pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/rocm6.3
#    6. Intel XPU 加速 (Linux, Intel 独显)
#         pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/xpu
# ============================================================
# Legacy .doc 解析可选 (Windows + Python 3.10 通常装不上 textract): .doc 转 .docx 后再处理

dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.32.1",
    "pydantic==2.10.3",
    "pydantic-settings==2.6.1",
    "httpx==0.28.1",
    "PyYAML==6.0.2",
    "langchain==0.3.9",
    "langchain-community==0.3.9",
    "elasticsearch==8.17.0",
    # 文档解析 OCR 链路 (跨平台 CPU 包, 与 GPU 无关, 保留在基础依赖)
    "pypdf==5.5.0",
    "PyMuPDF==1.24.14",
    "python-docx==1.1.2",
    "opencv-python==4.11.0.86",
    "rapidocr-onnxruntime==1.4.4",
    "onnxruntime==1.22.0",  # OCR 必需, 跨平台 CPU wheel, 避开 cp310 无 wheel 问题
    "minio==7.2.15",
    "psutil==5.9.8",
]

[project.optional-dependencies]
# 本地 Embedding 模型推理依赖 (sentence-transformers 隐式拉入 torch, 约 1~2GB).
# 纯在线模型部署 (embedding.source: service) 不需要安装本 extra.
local-model = [
    "sentence-transformers==3.3.1",
    # transformers 锁 4.45.2:
    #   1) 避开 transformers 4.48+ 引入的 check_torch_load_is_safe (CVE-2025-32434) 硬性检查
    #   2) 配合 app/embeddings/__init__.py _resolve_device() 的 privateuseone:0 lazy init,
    #      真实启用 Arc 140T GPU 加速 (修复前是写死 'dml' 字符串的 bug, 从未生效)
    #   3) sentence-transformers 3.3.1 官方测试矩阵同期 (2024-12)
    #   升级到 4.46+ 需先验证 check_torch_load_is_safe 仍未引入 (4.48 之前安全)
    "transformers==4.45.2",
    "huggingface-hub>=0.20.0,<0.30",
    "tokenizers<0.21",
    # Windows 专属包 (DirectML 是微软 Windows GPU API, PyPI 仅有 win_amd64 wheel),
    # 必须用 platform_system 标记做平台隔离, 否则 Linux 上报 No matching distribution found
    "onnxruntime-directml==1.22.0; platform_system == 'Windows'",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "httpx>=0.28",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = [".venv", "data", "__pycache__"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # line too long (由 line-length 控制)
    "B008",  # function call in default argument (FastAPI Depends)
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
warn_unused_configs = true
exclude = ["data", ".venv", "__pycache__"]

[tool.pytest.ini_options]
testpaths = ["tests", "app"]
asyncio_mode = "auto"
