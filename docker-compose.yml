# JC RAG 开源版 Docker Compose 编排
# 用途: 纯开源版一键启动基础服务 + community Python
# 区别: 仅含基础服务 + community Python, 不含 Java 启动模块和 pro Python
# 用法: docker-compose -f jc-rag-community/docker-compose.yml up -d
# 注意: Milvus v2.6 standalone 强依赖 etcd (元数据) + minio (对象存储)
#       minio 实际使用远程服务（启用密码），地址与凭证写在 milvus 服务 environment 中
#       本地 minio 服务已注释停用，如需切回本地可自行取消注释
version: "3.8"

services:
  # ============================ etcd (Milvus 元数据存储) ============================
  etcd:
    container_name: jc-rag-etcd
    image: quay.io/coreos/etcd:v3.5.18
    restart: unless-stopped
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    volumes:
      - ../volumes/etcd:/etcd
    command:
      - etcd
      - -advertise-client-urls=http://etcd:2379
      - -listen-client-urls=http://0.0.0.0:2379
      - -data-dir=/etcd
    networks:
      - jc-rag-net

  # ============================ minio (已停用: 改用远程 MinIO) ============================
  # 本地 minio 保留备用, 如需切回本地: 取消注释并把 milvus/python 的地址改回 minio:9000
  # minio:
  #   container_name: jc-rag-minio
  #   image: minio/minio:RELEASE.2024-09-13T20-26-02Z
  #   restart: unless-stopped
  #   command: server /data --console-address ":9001"
  #   environment:
  #     MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
  #     MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
  #   ports:
  #     - "9000:9000"
  #     - "9001:9001"
  #   volumes:
  #     - ../volumes/minio:/data
  #   networks:
  #     - jc-rag-net

  # ============================ milvus standalone ============================
  milvus:
    container_name: jc-rag-milvus
    image: milvusdb/milvus:v2.6.5
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      # MinIO 使用远程服务（启用密码），地址与凭证通过环境变量注入（见 .env.example）
      MINIO_ADDRESS: ${MINIO_ADDRESS:-localhost:9000}
      MINIO_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_USE_SSL: "false"
    ports:
      - "19530:19530"
    depends_on:
      - etcd
    volumes:
      - ../volumes/milvus:/var/lib/milvus
    networks:
      - jc-rag-net

  # ============================ elasticsearch ============================
  elasticsearch:
    container_name: jc-rag-es
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    ports:
      - "9200:9200"
    volumes:
      - ../volumes/elasticsearch:/usr/share/elasticsearch/data
    networks:
      - jc-rag-net

  # ============================ redis ============================
  redis:
    container_name: jc-rag-redis
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - jc-rag-net

  # ============================ mysql ============================
  mysql:
    container_name: jc-rag-mysql
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-jc_rag}
    ports:
      - "3306:3306"
    volumes:
      - ../volumes/mysql:/var/lib/mysql
    networks:
      - jc-rag-net

  # ============================ 开源版 Python (RAG 主服务) ============================
  jc-rag-python-community:
    image: jc-rag-python-community:0.0.1-SNAPSHOT
    build:
      context: ..
      dockerfile: jc-rag-community/jc-rag-service/docker/Dockerfile
    container_name: jc-rag-python-community
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ES_URL=http://elasticsearch:9200
      # MinIO 地址与凭证配置在 rag_config.yml 的 storage.minio 段（构建时打入镜像）,
      # 代码不读取 MINIO_* 环境变量, 故此处不再配置
      - MILVUS_HOST=milvus
      - MILVUS_PORT=19530
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    depends_on:
      - elasticsearch
      - milvus
    networks:
      - jc-rag-net

networks:
  jc-rag-net:
    driver: bridge
