# JC RAG 开源版 Docker Compose 编排
# 用途: 纯开源版一键启动基础服务 + community Python
# 区别: 仅含基础服务 + community Python, 不含 Java 启动模块和 pro Python
# 用法: docker-compose -f jc-rag-community/docker-compose.yml up -d
version: "3.8"

services:
  # ============================ 开源版 Python (RAG 主服务) ============================
  jc-rag-python-community:
    image: jc-rag-python-community:0.0.1-SNAPSHOT
    build:
      context: ..
      dockerfile: jc-rag-community/jc-rag-service/docker/Dockerfile
    container_name: jc-rag-python-community
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ES_URL=http://elasticsearch:9200
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:-minioadmin}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    depends_on:
      - elasticsearch
      - minio
    networks:
      - jc-rag-net

  # ============================ 基础设施 ============================
  mysql:
    image: mysql:8.0
    container_name: jc-rag-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-root123}
      MYSQL_DATABASE: ${DB_NAME:-jc_rag}
    ports:
      - "3306:3306"
    volumes:
      - ../volumes/mysql:/var/lib/mysql
    networks:
      - jc-rag-net

  redis:
    image: redis:7-alpine
    container_name: jc-rag-redis
    restart: unless-stopped
    networks:
      - jc-rag-net

  milvus:
    image: milvusdb/milvus:v2.6.5
    container_name: jc-rag-milvus
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    ports:
      - "19530:19530"
    volumes:
      - ../volumes/milvus:/var/lib/milvus
    networks:
      - jc-rag-net

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
    container_name: jc-rag-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    ports:
      - "9200:9200"
    volumes:
      - ../volumes/elasticsearch:/usr/share/elasticsearch/data
    networks:
      - jc-rag-net

  minio:
    image: minio/minio:latest
    container_name: jc-rag-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ../volumes/minio:/data
    networks:
      - jc-rag-net

networks:
  jc-rag-net:
    driver: bridge
